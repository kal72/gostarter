name: Verify generator
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make ui
      - run: git diff --exit-code -- internal/web/ui assets/css/tailwind.css assets/vendor
      - run: go test -race -timeout=5m ./...
      - run: go vet ./...
      - run: go build ./...
      - run: make test-ui
